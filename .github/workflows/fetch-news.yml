name: Fetch Daily AI News

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  fetch-news:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Fetch and save AI news
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python3 << 'PYEOF'
          import urllib.request, urllib.error, json, datetime, os

          api_key = os.environ.get('ANTHROPIC_API_KEY', '')
          today = datetime.date.today().isoformat()

          print(f'API key present: {bool(api_key)}')
          print(f'API key length: {len(api_key)}')
          print(f'Today: {today}')

          payload = json.dumps({
            "model": "claude-sonnet-4-6",
            "max_tokens": 4000,
            "system": f"You are an AI news curator. Today is {today}. Generate a realistic list of 8 recent AI news stories from the past few days. Return ONLY a valid JSON array with objects: title (string), summary (2-3 sentence string), url (string, use real news site URLs), source (string), date (string like May 3), tags (array of 1-2 strings from: llm, agentic, rag, multimodal, research, tools, safety, industry). Return ONLY the JSON array, no markdown, no backticks.",
            "messages": [{"role": "user", "content": f"Generate 8 recent AI news stories as a JSON array. Today is {today}."}]
          }).encode('utf-8')

          req = urllib.request.Request(
            'https://api.anthropic.com/v1/messages',
            data=payload,
            headers={
              'Content-Type': 'application/json',
              'x-api-key': api_key,
              'anthropic-version': '2023-06-01'
            }
          )

          try:
            with urllib.request.urlopen(req, timeout=120) as resp:
              data = json.loads(resp.read())
          except urllib.error.HTTPError as e:
            error_body = e.read().decode('utf-8')
            print(f'HTTP Error {e.code}: {error_body}')
            raise

          text = ''.join(b['text'] for b in data.get('content', []) if b['type'] == 'text')
          print('Response preview:', text[:200])

          s, e = text.find('['), text.rfind(']')
          if s == -1 or e == -1:
            raise ValueError(f'No JSON array found. Got: {text[:300]}')

          articles = json.loads(text[s:e+1])
          output = {
            'articles': articles,
            'date': today,
            'updated': datetime.datetime.utcnow().isoformat() + 'Z'
          }

          with open('public/news.json', 'w') as f:
            json.dump(output, f, indent=2)

          print(f'Successfully saved {len(articles)} articles')
          PYEOF

      - name: Commit and push news.json
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add public/news.json
          git diff --quiet && git diff --staged --quiet || git commit -m "Daily news update $(date +%Y-%m-%d)"
          git push