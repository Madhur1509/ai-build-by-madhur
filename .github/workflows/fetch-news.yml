name: Fetch Daily AI News

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  fetch-news:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Fetch and save AI news
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python3 << 'PYEOF'
          import urllib.request, urllib.error, json, datetime, os, subprocess

          api_key = os.environ.get('ANTHROPIC_API_KEY', '')
          today = datetime.date.today().isoformat()

          payload = json.dumps({
            "model": "claude-sonnet-4-6",
            "max_tokens": 4000,
            "tools": [{"type": "web_search_20250305", "name": "web_search"}],
            "system": f"You are an AI news curator for AI Build by Madhur. Today is {today}. Search the web for the latest AI news from the past 1-2 days. Find 8-10 diverse stories across LLMs, agentic systems, RAG, multimodal models, AI safety, AI tools, and industry news. Return ONLY a valid JSON array with objects: title, summary (2-3 sentences), url, source, date, tags (1-2 from: llm/agentic/rag/multimodal/research/tools/safety/industry). Return ONLY the JSON array, no markdown.",
            "messages": [{"role": "user", "content": f"Get top AI news for {today}, return as JSON array."}]
          }).encode('utf-8')

          req = urllib.request.Request(
            'https://api.anthropic.com/v1/messages',
            data=payload,
            headers={
              'Content-Type': 'application/json',
              'x-api-key': api_key,
              'anthropic-version': '2023-06-01'
            }
          )

          with urllib.request.urlopen(req, timeout=120) as resp:
            data = json.loads(resp.read())

          text = ''.join(b['text'] for b in data.get('content', []) if b['type'] == 'text')
          s, e = text.find('['), text.rfind(']')
          if s == -1 or e == -1:
            raise ValueError(f'No JSON array in response. Got: {text[:300]}')

          articles = json.loads(text[s:e+1])
          output = {
            'articles': articles,
            'date': today,
            'updated': datetime.datetime.utcnow().isoformat() + 'Z'
          }

          with open('public/news.json', 'w') as f:
            json.dump(output, f, indent=2)

          print(f'Successfully saved {len(articles)} articles')
          PYEOF

      - name: Commit and push news.json
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add public/news.json
          git diff --quiet && git diff --staged --quiet || git commit -m "Daily news update $(date +%Y-%m-%d)"
          git push